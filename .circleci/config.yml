            fi
          working_directory: branding

  build_message_docker_image:

    docker:
      - image: cimg/openjdk:18.0

    steps:
      - restore_cache:
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-message

      - setup_remote_docker:
