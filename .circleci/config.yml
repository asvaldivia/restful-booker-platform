  run_message_build:

    docker:
      - image: cimg/openjdk:18.0

    environment:
      MAVEN_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
      - run:
          command: |
            mvn clean install -Drevision=$(git rev-parse --short HEAD)
          working_directory: message
      - save_cache:
          paths:
            - message/
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-message

  run_assets_tests:

    docker:
      - image: cimg/openjdk:20.0-node
    resource_class: large
    steps:
      - restore_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
#      - run:
#          name: Install Sauce Connect Proxy
#          command: |
#            cd /tmp
#            curl https://saucelabs.com/downloads/sc-4.6.2-linux.tar.gz -o saucelabs.tar.gz
#            tar -xzf saucelabs.tar.gz
#            chmod a+x sc-4.6.2-linux/bin/sc
#            sudo cp sc-4.6.2-linux/bin/sc /usr/local/bin
#            sc --version
      - run:
          command: |
            echo "[BUILDING] Assets"
            npm install --legacy-peer-deps
            npm test -- --runInBand
            npm run build
            cd ..
            cd api
            if [[ -z "${APPLITOOLS_API_KEY}" ]]; then
              printf "Skipping visual checks because no applitools api key has been set. Assign a key to APPLITOOLS_API_KEY to run visual checks"
              mvn install -Drevision=$(git rev-parse --short HEAD)
            else
              sc -u ${SAUCE_USERNAME} -k ${SAUCE_ACCESS_KEY} -x https://eu-central-1.saucelabs.com/rest/v1 --se-port 4445 &
              wget --retry-connrefused --no-check-certificate -T 60 localhost:4445

              mvn install -Drevision=$(git rev-parse --short HEAD) -P ci
            fi
          working_directory: assets/js
          environment:
            BROWSER: remote
      - save_cache:
          paths:
            - assets/
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-assets

  build_auth_docker_image:

    docker:
      - image: cimg/openjdk:18.0

    steps:
      - restore_cache:
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-auth

      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          command: |
            if [ -f ~/project/auth/target/restful-booker-platform-auth-*-exec.jar ] && [ $CIRCLE_BRANCH == "trunk" ]; then
              echo "[BUILDING] Auth"
              TAG=$(ls target/restful-booker-platform-auth-*-exec.jar | cut -d '-' -f 5 | cut -c1-11)
              echo "[INFO] Image tag: $TAG"
              echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
              docker build -t $DOCKER_USER/restfulbookerplatform_auth:$TAG -t $DOCKER_USER/restfulbookerplatform_auth:latest .
              echo "[INFO] Pushing tag: $TAG"
              docker push $DOCKER_USER/restfulbookerplatform_auth:$TAG
              echo "[INFO] Pushing tag: latest"
              docker push $DOCKER_USER/restfulbookerplatform_auth:latest
              echo "[SUCCESS] Auth docker image built and pushed"
            else
              echo "[SKIPPING] Auth"
            fi
          working_directory: auth

  build_booking_docker_image:

    docker:
      - image: cimg/openjdk:18.0

    steps:
      - restore_cache:
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-booking

      - setup_remote_docker:
          docker_layer_caching: false

      - run:
          name: Build and Push Booking Docker Image (Robust)
          working_directory: booking
          command: |
            # Use 'find' to robustly locate the executable JAR and assign the full path to a variable.
            JAR_FILE=$(find target -name "restful-booker-platform-booking-*-exec.jar" -print -quit)
            
            # Check for existence of the JAR file (non-empty variable) and the correct branch
            if [ -n "$JAR_FILE" ] && [ "$CIRCLE_BRANCH" == "trunk" ]; then
              echo "[BUILDING] Booking"
              
              # Extract the filename part (e.g., restful-booker-platform-booking-1.7.53116d9-exec.jar)
              FILENAME=$(basename "$JAR_FILE")
              
              # Use 'cut' to reliably extract the version tag (the 5th hyphen-separated field, which is the revision)
              # The cut logic provided by the user: | cut -d '-' -f 5 | cut -c1-11
              TAG=$(echo "$FILENAME" | cut -d '-' -f 5 | cut -c1-11)
              
              if [ -z "$TAG" ]; then
                echo "[ERROR] Failed to extract version tag from JAR filename: $FILENAME. Skipping build."
                exit 1
              fi

              echo "[INFO] Image tag: $TAG"
              
              # Login
              echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
              
              # Build
              docker build -t $DOCKER_USER/restfulbookerplatform_booking:$TAG -t $DOCKER_USER/restfulbookerplatform_booking:latest .
              
              # Push
              echo "[INFO] Pushing tag: $TAG"
              docker push $DOCKER_USER/restfulbookerplatform_booking:$TAG
              echo "[INFO] Pushing tag: latest"
              docker push $DOCKER_USER/restfulbookerplatform_booking:latest
              echo "[SUCCESS] Booking docker image built and pushed"
            else
              echo "[SKIPPING] Booking"
              if [ -z "$JAR_FILE" ]; then
                echo "Reason: JAR file not found in 'target/' after cache restore. Listing target/ contents for debugging:"
                ls -l target/
              elif [ "$CIRCLE_BRANCH" != "trunk" ]; then
                echo "Reason: Current branch is '$CIRCLE_BRANCH', but required branch is 'trunk'."
              fi
            fi

  build_report_docker_image:

    docker:
      - image: cimg/openjdk:18.0

    steps:
      - restore_cache:
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-report

      - setup_remote_docker:
          docker_layer_caching: false

      - run:
          command: |
            if [ -f ~/project/report/target/restful-booker-platform-report-*-exec.jar ] && [ $CIRCLE_BRANCH == "trunk" ]; then
              echo "[BUILDING] Report"
              TAG=$(ls target/restful-booker-platform-report-*-exec.jar | cut -d '-' -f 5 | cut -c1-11)
              echo "[INFO] Image tag: $TAG"
              echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
              docker build -t $DOCKER_USER/restfulbookerplatform_report:$TAG -t $DOCKER_USER/restfulbookerplatform_report:latest .
              echo "[INFO] Pushing tag: $TAG"
              docker push $DOCKER_USER/restfulbookerplatform_report:$TAG
              echo "[INFO] Pushing tag: latest"
              docker push $DOCKER_USER/restfulbookerplatform_report:latest
              echo "[SUCCESS] Report docker image built and pushed"
            else
              echo "[SKIPPING] Report"
            fi
          working_directory: report

  build_room_docker_image:

    docker:
      - image: cimg/openjdk:18.0

    steps:
      - restore_cache:
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-room

      - setup_remote_docker:
