  build_proxy_docker_image:
    
    docker:
      - image: cimg/base:stable
    steps:
      - restore_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          command: |
            if [ -d ~/project/proxy ] && [ $CIRCLE_BRANCH == "trunk" ]; then
              echo "[BUILDING] Proxy"
              echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
              docker build -t $DOCKER_USER/restfulbookerplatform_proxy:latest .
              echo "[INFO] Pushing tag: latest"
              docker push $DOCKER_USER/restfulbookerplatform_proxy:latest
              echo "[SUCCESS] Proxy docker image built and pushed"
            else
              echo "[SKIPPING] Proxy"
            fi
          working_directory: proxy

  run_e2e_tests_ephemeral:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: large
    steps:
      - checkout

      # NEW STEP: Checkout the Cypress E2E project into the designated directory
      - run:
          name: Checkout Cypress E2E Tests Repository
          command: |
            echo "Cloning Cypress repository using SSH..."
            git clone git@github.com:asvaldivia/cypress-pom-example.git cypress-tests
            echo "Cypress E2E tests checked out successfully into 'cypress-tests'."
      
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login --username $DOCKER_USER --password-stdin
      
      - run:
          name: Pull Docker images
          command: |
            echo "Pulling all service images..."
            docker pull $DOCKER_USER/restfulbookerplatform_auth:latest
            docker pull $DOCKER_USER/restfulbookerplatform_booking:latest
            docker pull $DOCKER_USER/restfulbookerplatform_room:latest
            docker pull $DOCKER_USER/restfulbookerplatform_report:latest
            docker pull $DOCKER_USER/restfulbookerplatform_branding:latest
            docker pull $DOCKER_USER/restfulbookerplatform_message:latest
            docker pull $DOCKER_USER/restfulbookerplatform_assets:latest
            docker pull $DOCKER_USER/restfulbookerplatform_proxy:latest
            echo "All images pulled successfully"
      
      - run:
          name: Create Docker network
          command: |
            docker network create rbp-host
      
      - run:
          name: Start all microservices
          command: |
            echo "Starting auth service..."
            docker run -d --network rbp-host --name rbp-auth \
              -e profile=prod -e dbRefresh=10 -p 3004:3004 \
              $DOCKER_USER/restfulbookerplatform_auth:latest
            
            echo "Starting booking service..."
            docker run -d --network rbp-host --name rbp-booking \
              -e profile=prod -e dbRefresh=10 -p 3000:3000 \
              $DOCKER_USER/restfulbookerplatform_booking:latest
            
            echo "Starting room service..."
            docker run -d --network rbp-host --name rbp-room \
              -e profile=prod -e dbRefresh=10 -p 3001:3001 \
              $DOCKER_USER/restfulbookerplatform_room:latest
            
            echo "Starting report service..."
            docker run -d --network rbp-host --name rbp-report \
              -e profile=prod -p 3005:3005 \
              $DOCKER_USER/restfulbookerplatform_report:latest
            
            echo "Starting branding service..."
            docker run -d --network rbp-host --name rbp-branding \
              -e profile=prod -e dbRefresh=10 -p 3002:3002 \
              $DOCKER_USER/restfulbookerplatform_branding:latest
            
            echo "Starting message service..."
            docker run -d --network rbp-host --name rbp-message \
              -e profile=prod -e dbRefresh=10 -p 3006:3006 \
              $DOCKER_USER/restfulbookerplatform_message:latest
            
            echo "Starting assets service..."
            docker run -d --network rbp-host --name rbp-assets \
              -e profile=prod -p 3003:3003 \
              $DOCKER_USER/restfulbookerplatform_assets:latest

            echo "Starting proxy service..."
            docker run -d --network rbp-host --name rbp-proxy \
              -p 80:80 \
              $DOCKER_USER/restfulbookerplatform_proxy:latest 
            
            echo "All services started"
      
      - run:
          name: Wait for services to be ready
          command: |
            echo "Waiting for services to start..."
            sleep 30
            
            echo "Checking service health..."
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3004/auth/actuator/health || echo "Auth health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000/booking/actuator/health || echo "Booking health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3001/room/actuator/health || echo "Room health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3005/report/actuator/health || echo "Report health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3002/branding/actuator/health || echo "Branding health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3006/message/actuator/health || echo "Message health check failed"
            curl --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3003 || echo "Assets health check failed"
            
            echo "All services are ready"
      
      - run:
          name: Show running containers
          command: |
            docker ps
            echo "Checking logs for any startup errors..."
            docker logs rbp-auth --tail 20
            
      - run:
          name: Run Cypress E2E tests
          command: |
            cd cypress-tests
            npm install
            npm run cy:run:full -- --env BASE_URL=http://localhost:${PROXY_PORT}
          environment:
            TARGET: localhost
            BROWSER: chrome
            PROXY_PORT: 80
      
      - run:
          name: Cleanup (runs even on failure)
          when: always
          command: |
            echo "Stopping and removing all containers..."
            docker stop rbp-auth rbp-booking rbp-room rbp-report rbp-branding rbp-message rbp-assets || true
            docker rm rbp-auth rbp-booking rbp-room rbp-report rbp-branding rbp-message rbp-assets || true
            docker network rm rbp-host || true
            echo "Cleanup complete"
      
      - store_artifacts:
        name: Store Mochawesome HTML Report
        path: cypress-tests/cypress/reports
        destination: mochawesome-report
      - store_artifacts:
        name: Store Merged JSON Data
        path: cypress-tests/cypress/results/merged.json
        destination: mochawesome-data
      - store_test_results:
        path: cypress-tests/mochawesome-report
      - store_artifacts:
        path: cypress-tests/cypress/videos
      - store_artifacts:
        path: cypress-tests/cypress/screenshots
  

workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - checkout_code
      
      # Build all services
      - run_auth_build:
          requires:
            - checkout_code
      - run_booking_build:
          requires:
            - checkout_code
      - run_report_build:
          requires:
            - checkout_code
      - run_room_build:
          requires:
            - checkout_code
      - run_branding_build:
          requires:
            - checkout_code
      - run_message_build:
          requires:
            - checkout_code
      - run_assets_tests:
          requires:
            - checkout_code
      
      # Build Docker images
      - build_auth_docker_image:
          requires:
            - run_auth_build
      - build_booking_docker_image:
          requires:
            - run_booking_build
      - build_report_docker_image:
          requires:
            - run_report_build
      - build_room_docker_image:
          requires:
            - run_room_build
      - build_branding_docker_image:
          requires:
            - run_branding_build
      - build_message_docker_image:
          requires:
            - run_message_build
      - build_assets_docker_image:
          requires:
            - run_assets_tests
      - build_proxy_docker_image:
          requires:
            - checkout_code
      
      # Run E2E tests in ephemeral environment
      - run_e2e_tests_ephemeral:
          requires:
            - build_auth_docker_image
            - build_booking_docker_image
            - build_report_docker_image
            - build_room_docker_image
            - build_branding_docker_image
            - build_message_docker_image
            - build_assets_docker_image
            - build_proxy_docker_image
