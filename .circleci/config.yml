# Java Maven CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
version: 2
jobs:
  checkout_code:

    docker:
      - image: cimg/openjdk:18.0

    environment:
      MAVEN_OPTS: -Xmx3200m

    steps:
      - checkout
      - run:
          command: |
            extract=`mvn org.apache.maven.plugins:maven-help-plugin:3.1.0:evaluate -Dexpression=project.version -q -DforceStdout`
            version=${extract/SNAPSHOT/$(git rev-parse --short HEAD)}
            mkdir ~/tmp
            touch ~/tmp/$version.tmp
          working_directory: auth
      - save_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/

  run_auth_build:

    docker:
      - image: cimg/openjdk:18.0

    environment:
        MAVEN_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
      - run:
          command: |
            mvn clean install -Drevision=$(git rev-parse --short HEAD)
          working_directory: auth
      - save_cache:
          paths:
            - auth/
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-auth

  run_booking_build:

    docker:
      - image: cimg/openjdk:18.0

    environment:
        MAVEN_OPTS: -Xmx3200m

    steps:
      - restore_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
      - run:
          command: |
            mvn clean install -Drevision=$(git rev-parse --short HEAD)
          working_directory: booking
      - save_cache:
          paths:
            - booking/
          key: v1-dependencies-{{ .Environment.CIRCLE_SHA1 }}-booking

  run_report_build:

    docker:
      - image: cimg/openjdk:18.0

    environment:
        MAVEN_OPTS: -Xmx3200m

    steps:
